name: Deploy Cloud Functions

# Manual only. The finance app deploys its own functions to the same Firebase
# project under the "default" codebase; this one owns "rx". Both are scoped so
# neither can delete the other's.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm --prefix functions install
      - run: npm --prefix functions test

      - run: npm install -g firebase-tools

      # Credentials: a service-account key (the FIREBASE_SERVICE_ACCOUNT secret,
      # the whole JSON file pasted in) is preferred; a legacy FIREBASE_TOKEN
      # from `firebase login:ci` still works. The key is written to the
      # runner's temp dir and GOOGLE_APPLICATION_CREDENTIALS is only set when
      # it exists — pointing it at a missing file fails the deploy on its own.
      - name: Set up Firebase credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/key.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/key.json" >> "$GITHUB_ENV"
          elif [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::No Firebase credentials. Add a FIREBASE_SERVICE_ACCOUNT secret (a service-account JSON key with the Firebase Admin / Cloud Functions Admin roles) under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - run: firebase deploy --only functions:rx --project billtracker-256ef --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
