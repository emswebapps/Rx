<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/Rx/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/Rx/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Rx/apple-touch.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="What you take, when you took it, and how much is left." />
    <meta name="application-name" content="Rx" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rx" />
    <!-- The dark ground, which is `--bg` in index.css and what the app paints
         before React has mounted. The manifest's theme_color and
         background_color are the same value, so an installed launch goes
         splash → first paint without a colour changing underneath it.
         The starting value only: Rx's light mode is a setting rather than a
         media query, so `ThemeSync` rewrites this to match once it knows which
         one is on — otherwise a light-mode app keeps a dark status bar. -->
    <meta name="theme-color" content="#09090b" />
    <title>Rx</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
